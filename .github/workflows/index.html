<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beninging</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            background: #f0f0f0;
            padding: 60px;
        }

        .header-area {
            width: 200px;
            text-align: left;
            flex-shrink: 0;
        }
        

        .header-area button {
            background: transparent !important;
            border: none;
            color: #333;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 14px;
             margin-top: 10px;
        }
        .header-area button:hover {
            background: transparent;
            border-radius: 4px;
        }


        /*  .content-area {
            display: flex;
            justify-content: centers;
            padding: 20px;
            border-radius: 8px;
        }  */

        hr {
            border: none; 
            border-top: 1px solid #666665;
            width: 950px;
            margin: 15px 0;
        }

        .menu { display: none; }
        .menu.active { display: block; }

        /*  GALLERY  */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, 150px);
            gap: 0px;
            max-width: 750px;
            justify-content: center;
         
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .gallery img:hover {
            border-color: #667eea;
        }

        /*img { image-rendering: pixelated; } */

        /* LG */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 36px;
            cursor: pointer;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 14px;
        }

        /* Navigation arrows */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
        }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="header-area">
        <h1>Gallery</h1>
        
        <button onclick="showMenu('Main', event)">1</button>
        <button onclick="showMenu('Sub', event)">2</button>

        </div>
    </div>
    <hr>
    <div class="content-area">
        <div id="Main" class="menu active"> 
            <div class="gallery">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
                <img src="pixel girl.png" alt="Pixel Girl">
            </div>
            <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">
            
       
        </div>

        <div id="Sub" class="menu"> 
            <p style="color:#666; padding:20px; text-align:left;">empty</p>
        </div>
    </div>
    <hr>
    <a href="https://example.com" target="_blank">Github</a>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <span class="lightbox-nav lightbox-prev" id="lightbox-prev">❮</span>
    <img src="" id="lightbox-img">
    <span class="lightbox-nav lightbox-next" id="lightbox-next">❯</span>
    <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>
    // Tab switching
    function showMenu(id, e) {
        document.querySelectorAll('.menu').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (e) {
            document.querySelectorAll('.tabs button').forEach(b => b.style.background = '#667eea');
            e.target.style.background = '#5568d3';
        }
        initGallery(); // Re-bind gallery for new tab
    } 

    // Gallery variables
    let images = [];
    let current = 0;
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbClose = document.getElementById('lightbox-close');
    const lbCounter = document.getElementById('lightbox-counter');
    const lbPrev = document.getElementById('lightbox-prev');
    const lbNext = document.getElementById('lightbox-next');

    // Initialize gallery images from active tab
    function initGallery() {
        const active = document.querySelector('.menu.active');
        images = active ? active.querySelectorAll('.gallery img') : [];
        images.forEach((img, i) => {
            img.onclick = (e) => { e.stopPropagation(); openLightbox(i); };
        });
        updateUI();
    }

    function openLightbox(index) {
        current = index;
        lbImg.src = images[current].src;
        lb.classList.add('active');
        document.body.style.overflow = 'hidden';
        updateUI();
    }

    function closeLightbox() {
        lb.classList.remove('active');
        document.body.style.overflow = '';
        lbImg.src = '';
    }

    function updateUI() {
        lbCounter.textContent = images.length ? `${current + 1} / ${images.length}` : '';
        lbPrev.style.opacity = current === 0 ? '0.3' : '1';
        lbNext.style.opacity = current === images.length - 1 ? '0.3' : '1';
    }

    function navigate(dir) {
        if (!images.length) return;
        const newIndex = current + dir;
        if (newIndex >= 0 && newIndex < images.length) {
            current = newIndex;
            lbImg.src = images[current].src;
            updateUI();
        }
    }

    // Event listeners
    lbClose.onclick = (e) => { e.stopPropagation(); closeLightbox(); };
    lb.onclick = (e) => { if (e.target === lb) closeLightbox(); };
    lbPrev.onclick = (e) => { e.stopPropagation(); navigate(-1); };
    lbNext.onclick = (e) => { e.stopPropagation(); navigate(1); };
    
    document.onkeydown = (e) => {
        if (!lb.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
    };

    //image drag
    document.querySelectorAll('img').forEach(img => {
        img.ondragstart = () => false;
    });

    // Start
    initGallery();
</script>

</body>
</html>
